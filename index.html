<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FlouraFlow — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --orange: #F5A235;
  --road: #5A8AB5;
  --road-dark: #4A7098;
  --block1: #DC8C2A;
  --block2: #C87828;
  --block3: #D48530;
  --park: #5DAD5D;
  --water: #6AB2D5;
  --dark: #1A1A2E;
  --text: #2C2C3E;
  --white: #FFFEF8;
  --road-width: 42px;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Space Grotesk', sans-serif;
  background: var(--orange);
  touch-action: none;
}

/* ── FULL-SCREEN MAP ── */
#map {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  background: var(--orange);
  overflow: hidden;
}

/* ── ROADS ── */
.road-h {
  position: absolute;
  left: 0; right: 0;
  height: var(--road-width);
  background: var(--road);
  transform: translateY(-50%);
  z-index: 2;
}
.road-v {
  position: absolute;
  top: 0; bottom: 0;
  width: var(--road-width);
  background: var(--road);
  transform: translateX(-50%);
  z-index: 2;
}
.road-h::after {
  content: '';
  position: absolute;
  top: 50%; left: 0; right: 0;
  height: 2px;
  transform: translateY(-50%);
  border-top: 2px dashed rgba(255,255,255,0.55);
}
.road-v::after {
  content: '';
  position: absolute;
  left: 50%; top: 0; bottom: 0;
  width: 2px;
  transform: translateX(-50%);
  border-left: 2px dashed rgba(255,255,255,0.55);
}

/* ── CITY BLOCKS ── */
.block {
  position: absolute;
  z-index: 1;
  border-radius: 4px;
  overflow: hidden;
}
.block-inner {
  position: absolute;
  inset: 10px;
  border-radius: 3px;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.25), 0 2px 6px rgba(0,0,0,0.2);
}

/* ── INTERSECTION MARKERS ── */
.intersection {
  position: absolute;
  z-index: 3;
  pointer-events: none;
  transform: translate(-50%, -50%);
}

/* ── TREES ── */
.tree {
  position: absolute;
  z-index: 4;
  pointer-events: none;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #7BC96A, #3D8B3D);
  box-shadow: 0 3px 6px rgba(0,0,0,0.3);
}

/* ── PROJECT PINS ── */
.pin {
  position: absolute;
  z-index: 10;
  cursor: pointer;
  transform: translate(-50%, -100%);
  transition: transform 0.15s ease;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
  animation: pinFloat 3s ease-in-out infinite;
}
.pin:hover {
  transform: translate(-50%, -110%) scale(1.12);
}
.pin:nth-child(odd) { animation-delay: -1.1s; }
.pin:nth-child(3n) { animation-delay: -0.6s; }

@keyframes pinFloat {
  0%, 100% { transform: translate(-50%, -100%); }
  50% { transform: translate(-50%, -112%); }
}
.pin:hover {
  animation: none;
  transform: translate(-50%, -110%) scale(1.12);
}

/* ── SCOOTER ── */
#scooter-wrap {
  position: absolute;
  z-index: 15;
  width: 140px;
  height: 90px;
  transform: translate(-50%, -50%);
  transition: left 1.8s cubic-bezier(0.45, 0.05, 0.55, 0.95),
              top 1.8s cubic-bezier(0.45, 0.05, 0.55, 0.95);
  animation: scooterBob 2.2s ease-in-out infinite;
  pointer-events: none;
}
@keyframes scooterBob {
  0%, 100% { margin-top: 0px; }
  50% { margin-top: -5px; }
}
#scooter-wrap.riding {
  animation: none;
}

/* ── SPEED LINES ── */
#speed-lines {
  position: absolute;
  z-index: 14;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}
#speed-lines.active { opacity: 1; }

/* ── HUD TOP BAR ── */
#hud {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  height: 64px;
  background: linear-gradient(to bottom, rgba(26,26,46,0.82) 0%, transparent 100%);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 14px;
  pointer-events: none;
}
#hud-title {
  font-family: 'Caveat', cursive;
  font-size: 28px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  letter-spacing: 0.5px;
}
#hud-pill {
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  color: rgba(255,255,255,0.9);
  font-weight: 500;
  letter-spacing: 0.3px;
}

/* ── TOAST ── */
#toast {
  position: fixed;
  top: -60px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 60;
  background: rgba(26,26,46,0.92);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 30px;
  padding: 10px 22px;
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  transition: top 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
#toast.show { top: 76px; }

/* ── SCREEN FLASH ── */
#flash {
  position: fixed;
  inset: 0;
  z-index: 55;
  background: rgba(255,255,255,0);
  pointer-events: none;
  transition: background 0.1s;
}
#flash.pop {
  animation: flashPop 0.5s ease-out forwards;
}
@keyframes flashPop {
  0% { background: rgba(255,255,255,0.6); }
  100% { background: rgba(255,255,255,0); }
}

/* ── DUST PARTICLES ── */
.dust {
  position: absolute;
  z-index: 13;
  border-radius: 50%;
  background: rgba(245,162,53,0.7);
  pointer-events: none;
  animation: dustPop 0.8s ease-out forwards;
}
@keyframes dustPop {
  0% { transform: scale(0) translate(0,0); opacity: 0.8; }
  100% { transform: scale(1) translate(var(--dx), var(--dy)); opacity: 0; }
}

/* ── ZOOM RINGS ── */
.ring {
  position: absolute;
  z-index: 11;
  border-radius: 50%;
  border: 3px solid var(--ring-color, #F5A235);
  pointer-events: none;
  transform: translate(-50%, -50%) scale(0);
  animation: ringExpand 0.9s ease-out forwards;
}
@keyframes ringExpand {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 0.9; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}

/* ── BOTTOM SHEET ── */
#sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: rgba(0,0,0,0);
  pointer-events: none;
  transition: background 0.3s;
}
#sheet-backdrop.open {
  background: rgba(0,0,0,0.35);
  pointer-events: all;
}

#sheet {
  position: fixed;
  bottom: -100%;
  left: 0; right: 0;
  z-index: 71;
  background: #FFFEF8;
  border-radius: 24px 24px 0 0;
  padding: 0 0 env(safe-area-inset-bottom, 0);
  box-shadow: 0 -12px 40px rgba(0,0,0,0.3);
  transition: bottom 0.4s cubic-bezier(0.34, 1.3, 0.64, 1);
  max-height: 85vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
#sheet.open {
  bottom: 0;
}

#sheet-handle-area {
  padding: 12px 0 4px;
  display: flex;
  justify-content: center;
  cursor: grab;
  flex-shrink: 0;
}
#sheet-handle {
  width: 40px; height: 5px;
  background: #D4CAB8;
  border-radius: 3px;
}

#sheet-close {
  position: absolute;
  top: 14px; right: 16px;
  width: 32px; height: 32px;
  background: rgba(0,0,0,0.07);
  border: none;
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  color: #555;
  transition: background 0.15s;
  z-index: 2;
}
#sheet-close:hover { background: rgba(0,0,0,0.13); }

#sheet-content {
  padding: 8px 24px 32px;
  overflow-y: auto;
  flex: 1;
  -webkit-overflow-scrolling: touch;
}

#sheet-tag {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #fff;
  margin-bottom: 10px;
}

#sheet-title {
  font-size: 26px;
  font-weight: 700;
  color: #1A1A2E;
  line-height: 1.2;
  margin-bottom: 6px;
}

#sheet-location {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  color: #888;
  margin-bottom: 14px;
  font-weight: 500;
}

#sheet-desc {
  font-size: 15px;
  color: #444;
  line-height: 1.6;
  margin-bottom: 18px;
}

#sheet-stack {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}
.stack-chip {
  padding: 5px 13px;
  background: #F3EDE3;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  color: #5A4530;
}

#sheet-buttons {
  display: flex;
  gap: 12px;
}
.sheet-btn {
  flex: 1;
  padding: 14px;
  border-radius: 14px;
  border: none;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.15s;
  letter-spacing: 0.3px;
}
.sheet-btn:active { transform: scale(0.97); opacity: 0.85; }
.sheet-btn-primary {
  background: var(--accent, #F5A235);
  color: #fff;
}
.sheet-btn-secondary {
  background: #F0E8DC;
  color: #3A2A1A;
}
</style>
</head>
<body>

<div id="map"></div>
<div id="hud">
  <span id="hud-title">FlouraFlow</span>
  <span id="hud-pill">📍 tap a pin</span>
</div>
<div id="toast">🛵 Arrived!</div>
<div id="flash"></div>

<div id="sheet-backdrop"></div>
<div id="sheet">
  <div id="sheet-handle-area"><div id="sheet-handle"></div></div>
  <button id="sheet-close">✕</button>
  <div id="sheet-content">
    <div id="sheet-tag">Tag</div>
    <div id="sheet-title">Title</div>
    <div id="sheet-location">📍 Location</div>
    <div id="sheet-desc">Description</div>
    <div id="sheet-stack"></div>
    <div id="sheet-buttons">
      <button class="sheet-btn sheet-btn-primary" id="btn-demo">🚀 Live Demo</button>
      <button class="sheet-btn sheet-btn-secondary" id="btn-source">📦 Source Code</button>
    </div>
  </div>
</div>

<script>
// ── PROJECT DATA ──
const PROJECTS = [
  {
    id: 'flouraflow',
    name: 'FlouraFlow',
    tag: 'Web App',
    color: '#E8772A',
    location: 'Downtown Hub',
    pos: { x: 33, y: 11 },
    desc: 'A full-stack plant care app. Log plants, set watering reminders, track growth with photo journals.',
    stack: ['React', 'Node.js', 'MongoDB', 'Tailwind'],
    demo: '#', source: '#'
  },
  {
    id: 'neon-arcade',
    name: 'Neon Arcade',
    tag: 'Game',
    color: '#8A5CF6',
    location: 'East Quarter',
    pos: { x: 72, y: 10 },
    desc: 'Browser-based retro arcade with Canvas API, high scores, neon pixel aesthetics.',
    stack: ['Vanilla JS', 'Canvas API', 'LocalStorage'],
    demo: '#', source: '#'
  },
  {
    id: 'transit-pulse',
    name: 'Transit Pulse',
    tag: 'Data Viz',
    color: '#0EA5E9',
    location: 'Central Station',
    pos: { x: 83, y: 37 },
    desc: 'Real-time bus & train delay heatmap. Aggregates transit data, animated D3 flow maps.',
    stack: ['D3.js', 'Python', 'FastAPI', 'WebSocket'],
    demo: '#', source: '#'
  },
  {
    id: 'lofi-corner',
    name: 'Lofi Corner',
    tag: 'Music App',
    color: '#EC4899',
    location: 'Café District',
    pos: { x: 65, y: 52 },
    desc: 'Curated lofi study player with mood playlists, ambient mixer (rain/café/wind), pomodoro timer.',
    stack: ['Vue.js', 'Web Audio API', 'Supabase'],
    demo: '#', source: '#'
  },
  {
    id: 'pixel-market',
    name: 'Pixel Market',
    tag: 'E-Commerce',
    color: '#10B981',
    location: 'West Village',
    pos: { x: 17, y: 67 },
    desc: 'Indie digital goods marketplace for pixel artists. Stripe payments, instant downloads.',
    stack: ['Next.js', 'Stripe', 'PostgreSQL', 'AWS S3'],
    demo: '#', source: '#'
  },
  {
    id: 'sky-notes',
    name: 'Sky Notes',
    tag: 'Mobile App',
    color: '#F59E0B',
    location: 'North Park',
    pos: { x: 47, y: 80 },
    desc: 'Minimalist note-taking PWA with E2E encryption, Markdown, offline mode, cross-device sync.',
    stack: ['React Native', 'SQLite', 'Crypto API'],
    demo: '#', source: '#'
  }
];

const ROAD_H = [20, 52, 80]; // percent
const ROAD_V = [22, 50, 78]; // percent

// ── AUDIO ──
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}

function playEngineRev() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(80, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(340, ctx.currentTime + 0.3);
    osc.frequency.linearRampToValueAtTime(180, ctx.currentTime + 0.7);
    osc.frequency.linearRampToValueAtTime(260, ctx.currentTime + 1.0);
    gain.gain.setValueAtTime(0.06, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 0.2);
    gain.gain.linearRampToValueAtTime(0.0, ctx.currentTime + 1.2);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 1.3);
  } catch(e) {}
}

function playBellChime() {
  try {
    const ctx = getAudio();
    [[523.25, 0], [659.25, 0.18], [783.99, 0.36]].forEach(([freq, t]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, ctx.currentTime + t);
      gain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 1.0);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + 1.1);
    });
  } catch(e) {}
}

// ── BUILD MAP ──
const map = document.getElementById('map');

function buildWorld() {
  const W = window.innerWidth;
  const H = window.innerHeight;

  // ─ CITY BLOCKS ─
  const blocks = [
    // Row 1 (above road 1, y~0–20%)
    { x1: 0,  y1: 0,  x2: 22, y2: 20, color: '#DC8C2A', inner: '#C97B1A' },
    { x1: 22, y1: 0,  x2: 50, y2: 20, color: '#D48530', inner: '#BE7320' },
    { x1: 50, y1: 0,  x2: 78, y2: 20, color: '#5DAD5D', inner: '#4A9B4A', ispark: true },
    { x1: 78, y1: 0,  x2: 100,y2: 20, color: '#DC8C2A', inner: '#C97B1A' },
    // Row 2 (between road 1 y~20% and road 2 y~52%)
    { x1: 0,  y1: 20, x2: 22, y2: 52, color: '#C87828', inner: '#B06818' },
    { x1: 22, y1: 20, x2: 50, y2: 52, color: '#DC8C2A', inner: '#C97B1A' },
    { x1: 50, y1: 20, x2: 78, y2: 52, color: '#D48530', inner: '#BE7320' },
    { x1: 78, y1: 20, x2: 100,y2: 52, color: '#6AB2D5', inner: '#5A9EC0', iswater: true },
    // Row 3 (between road 2 y~52% and road 3 y~80%)
    { x1: 0,  y1: 52, x2: 22, y2: 80, color: '#D48530', inner: '#BE7320' },
    { x1: 22, y1: 52, x2: 50, y2: 80, color: '#C87828', inner: '#B06818' },
    { x1: 50, y1: 52, x2: 78, y2: 80, color: '#DC8C2A', inner: '#C97B1A' },
    { x1: 78, y1: 52, x2: 100,y2: 80, color: '#D48530', inner: '#BE7320' },
    // Row 4 (below road 3 y~80%)
    { x1: 0,  y1: 80, x2: 22, y2: 100, color: '#5DAD5D', inner: '#4A9B4A', ispark: true },
    { x1: 22, y1: 80, x2: 50, y2: 100, color: '#DC8C2A', inner: '#C97B1A' },
    { x1: 50, y1: 80, x2: 78, y2: 100, color: '#C87828', inner: '#B06818' },
    { x1: 78, y1: 80, x2: 100,y2: 100, color: '#D48530', inner: '#BE7320' },
  ];

  // ─ ROAD WIDTH OFFSET ─
  const rw = 21; // half road width in px from center  — approximate for layout

  blocks.forEach(b => {
    const left   = (b.x1 / 100) * W;
    const top    = (b.y1 / 100) * H;
    const right  = (b.x2 / 100) * W;
    const bottom = (b.y2 / 100) * H;
    const width  = right - left;
    const height = bottom - top;

    const el = document.createElement('div');
    el.className = 'block';
    el.style.cssText = `
      left:${left}px; top:${top}px;
      width:${width}px; height:${height}px;
      background:${b.color};
    `;

    const inner = document.createElement('div');
    inner.className = 'block-inner';
    inner.style.background = b.inner;
    el.appendChild(inner);

    // Water ripple overlay
    if (b.iswater) {
      inner.style.background = `linear-gradient(145deg, #7AC8E0 0%, #5A9EC0 40%, #4A8AB0 100%)`;
      for (let i = 0; i < 3; i++) {
        const wave = document.createElement('div');
        wave.style.cssText = `
          position:absolute;
          left:${15+i*8}%;top:${30+i*15}%;
          width:60%;height:3px;
          background:rgba(255,255,255,0.3);
          border-radius:2px;
          transform:rotate(-5deg);
        `;
        inner.appendChild(wave);
      }
    }

    // Park details
    if (b.ispark) {
      inner.style.background = `radial-gradient(ellipse at 40% 40%, #6DC86D, #3D8B3D)`;
      // path
      const path = document.createElement('div');
      path.style.cssText = `
        position:absolute;
        left:30%;top:20%;width:40%;height:60%;
        background:rgba(200,160,80,0.4);
        border-radius:2px;
      `;
      inner.appendChild(path);
    }

    map.appendChild(el);
  });

  // ─ HORIZONTAL ROADS ─
  ROAD_H.forEach(yp => {
    const road = document.createElement('div');
    road.className = 'road-h';
    road.style.cssText = `top:${yp}%; z-index:2;`;
    map.appendChild(road);
  });

  // ─ VERTICAL ROADS ─
  ROAD_V.forEach(xp => {
    const road = document.createElement('div');
    road.className = 'road-v';
    road.style.cssText = `left:${xp}%; z-index:2;`;
    map.appendChild(road);
  });

  // ─ INTERSECTION BOXES (cover junctions) ─
  ROAD_H.forEach(yp => {
    ROAD_V.forEach(xp => {
      const box = document.createElement('div');
      box.style.cssText = `
        position:absolute;
        left:${xp}%; top:${yp}%;
        width:var(--road-width); height:var(--road-width);
        background:var(--road);
        transform:translate(-50%,-50%);
        z-index:2;
      `;
      map.appendChild(box);

      // X marker SVG
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('class', 'intersection');
      const size = 36;
      svg.setAttribute('width', size);
      svg.setAttribute('height', size);
      svg.style.cssText = `left:${xp}%; top:${yp}%;`;
      const l1 = document.createElementNS(ns, 'line');
      l1.setAttribute('x1', '4'); l1.setAttribute('y1', '4');
      l1.setAttribute('x2', String(size-4)); l1.setAttribute('y2', String(size-4));
      l1.setAttribute('stroke', 'rgba(240,130,30,0.65)');
      l1.setAttribute('stroke-width', '4');
      l1.setAttribute('stroke-linecap', 'round');
      const l2 = document.createElementNS(ns, 'line');
      l2.setAttribute('x1', String(size-4)); l2.setAttribute('y1', '4');
      l2.setAttribute('x2', '4'); l2.setAttribute('y2', String(size-4));
      l2.setAttribute('stroke', 'rgba(240,130,30,0.65)');
      l2.setAttribute('stroke-width', '4');
      l2.setAttribute('stroke-linecap', 'round');
      svg.appendChild(l1); svg.appendChild(l2);
      map.appendChild(svg);
    });
  });

  // ─ TREES ─
  const treePosns = [
    // park top-right
    {x:55,y:3,s:22},{x:63,y:7,s:18},{x:58,y:12,s:20},{x:70,y:4,s:16},{x:74,y:9,s:22},
    // park bottom-left
    {x:3,y:83,s:20},{x:8,y:88,s:16},{x:14,y:84,s:22},{x:5,y:92,s:18},{x:12,y:92,s:20},
    // sidewalk trees scattered
    {x:30,y:21,s:14},{x:40,y:21,s:12},{x:60,y:21,s:14},
    {x:25,y:51,s:14},{x:45,y:51,s:12},{x:70,y:51,s:14},
    {x:28,y:79,s:14},{x:55,y:79,s:12},{x:74,y:79,s:14},
    {x:22,y:35,s:12},{x:49,y:35,s:14},{x:77,y:35,s:12},
    {x:22,y:66,s:12},{x:49,y:66,s:14},{x:77,y:66,s:12},
  ];
  treePosns.forEach(t => {
    const tree = document.createElement('div');
    tree.className = 'tree';
    tree.style.cssText = `
      left:${t.x}%; top:${t.y}%;
      width:${t.s}px; height:${t.s}px;
      transform:translate(-50%,-50%);
      z-index:4;
    `;
    map.appendChild(tree);
  });

  // ─ SCOOTER ─
  const scooterWrap = document.createElement('div');
  scooterWrap.id = 'scooter-wrap';
  scooterWrap.style.left = '10%';
  scooterWrap.style.top  = '52%';
  scooterWrap.innerHTML = buildScooterSVG();
  map.appendChild(scooterWrap);

  // ─ SPEED LINES ─
  const speedLines = document.createElement('div');
  speedLines.id = 'speed-lines';
  speedLines.innerHTML = buildSpeedLinesSVG();
  map.appendChild(speedLines);

  // ─ PROJECT PINS ─
  PROJECTS.forEach((p, i) => {
    const pin = document.createElement('div');
    pin.className = 'pin';
    pin.dataset.id = p.id;
    pin.style.left = p.pos.x + '%';
    pin.style.top  = p.pos.y + '%';
    pin.innerHTML  = buildPinSVG(p.color, p.name);
    pin.style.animationDelay = `${-i * 0.45}s`;
    pin.addEventListener('click', () => handlePinClick(p));
    map.appendChild(pin);
  });
}

// ── INTERACTION STATE ──
let scooterX = 10;
let scooterY = 52;
let riding = false;
let faceRight = true;

function handlePinClick(project) {
  if (riding) return;
  riding = true;

  playEngineRev();

  const scooter = document.getElementById('scooter-wrap');
  const speedLines = document.getElementById('speed-lines');

  // Determine direction
  const targetX = project.pos.x;
  const targetY = project.pos.y;
  const dx = targetX - scooterX;
  const newFaceRight = dx >= 0;

  // Flip scooter
  if (newFaceRight !== faceRight) {
    faceRight = newFaceRight;
    scooter.style.transform = `translate(-50%, -50%) scaleX(${faceRight ? 1 : -1})`;
  }

  // Speed lines
  speedLines.style.left = (scooterX - 8) + '%';
  speedLines.style.top  = scooterY + '%';
  speedLines.style.transform = `translate(0, -50%) scaleX(${faceRight ? -1 : 1})`;
  speedLines.classList.add('active');

  // Add riding class (remove bob)
  scooter.classList.add('riding');

  // Move scooter
  scooter.style.left = targetX + '%';
  scooter.style.top  = targetY + '%';
  scooterX = targetX;
  scooterY = targetY;

  // After ride completes
  setTimeout(() => {
    speedLines.classList.remove('active');
    scooter.classList.remove('riding');
    scooter.style.animation = '';

    // Flash
    const flash = document.getElementById('flash');
    flash.classList.add('pop');
    setTimeout(() => flash.classList.remove('pop'), 600);

    // Bell chime
    playBellChime();

    // Dust
    spawnDust(targetX, targetY);

    // Rings
    spawnRings(project.pos.x, project.pos.y, project.color);

    // Toast
    showToast(`🛵 Arrived at ${project.location}!`);

    // Resume bob
    setTimeout(() => {
      scooter.style.animation = 'scooterBob 2.2s ease-in-out infinite';
    }, 100);

    // Open sheet
    setTimeout(() => {
      openSheet(project);
      riding = false;
    }, 500);

  }, 1900);
}

function spawnDust(xPct, yPct) {
  const W = window.innerWidth;
  const H = window.innerHeight;
  const cx = (xPct / 100) * W;
  const cy = (yPct / 100) * H;

  for (let i = 0; i < 10; i++) {
    const d = document.createElement('div');
    d.className = 'dust';
    const angle = Math.random() * Math.PI * 2;
    const dist  = 20 + Math.random() * 40;
    d.style.cssText = `
      left:${cx}px; top:${cy}px;
      width:${6 + Math.random() * 8}px;
      height:${6 + Math.random() * 8}px;
      --dx:${Math.cos(angle) * dist}px;
      --dy:${Math.sin(angle) * dist}px;
    `;
    map.appendChild(d);
    setTimeout(() => d.remove(), 900);
  }
}

function spawnRings(xPct, yPct, color) {
  for (let i = 0; i < 3; i++) {
    const ring = document.createElement('div');
    ring.className = 'ring';
    const size = 60 + i * 40;
    ring.style.cssText = `
      left:${xPct}%;
      top:${yPct}%;
      width:${size}px; height:${size}px;
      --ring-color:${color};
      animation-delay:${i * 0.22}s;
    `;
    map.appendChild(ring);
    setTimeout(() => ring.remove(), 1200 + i * 220);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

// ── BOTTOM SHEET ──
let activeProject = null;
let sheetStartY = 0;
let sheetDragActive = false;

function openSheet(project) {
  activeProject = project;
  document.getElementById('sheet-tag').textContent = project.tag;
  document.getElementById('sheet-tag').style.background = project.color;
  document.getElementById('sheet-title').textContent = project.name;
  document.getElementById('sheet-location').textContent = '📍 ' + project.location;
  document.getElementById('sheet-desc').textContent = project.desc;
  const stack = document.getElementById('sheet-stack');
  stack.innerHTML = '';
  project.stack.forEach(s => {
    const chip = document.createElement('span');
    chip.className = 'stack-chip';
    chip.textContent = s;
    stack.appendChild(chip);
  });
  document.getElementById('btn-demo').style.background = project.color;
  document.getElementById('btn-demo').onclick = () => window.open(project.demo, '_blank');
  document.getElementById('btn-source').onclick = () => window.open(project.source, '_blank');

  document.getElementById('sheet-backdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}

function closeSheet() {
  document.getElementById('sheet-backdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  riding = false;
}

document.getElementById('sheet-close').addEventListener('click', closeSheet);
document.getElementById('sheet-backdrop').addEventListener('click', closeSheet);

// ── SWIPE-DOWN TO CLOSE ──
const sheetEl = document.getElementById('sheet');
const handleArea = document.getElementById('sheet-handle-area');

function startDrag(y) {
  sheetStartY = y;
  sheetDragActive = true;
  sheetEl.style.transition = 'none';
}
function moveDrag(y) {
  if (!sheetDragActive) return;
  const dy = y - sheetStartY;
  if (dy > 0) {
    sheetEl.style.transform = `translateY(${dy}px)`;
  }
}
function endDrag(y) {
  if (!sheetDragActive) return;
  sheetDragActive = false;
  sheetEl.style.transition = '';
  const dy = y - sheetStartY;
  if (dy > 80) {
    sheetEl.style.transform = '';
    closeSheet();
  } else {
    sheetEl.style.transform = '';
  }
}

handleArea.addEventListener('touchstart', e => startDrag(e.touches[0].clientY), { passive: true });
handleArea.addEventListener('touchmove',  e => moveDrag(e.touches[0].clientY),  { passive: true });
handleArea.addEventListener('touchend',   e => endDrag(e.changedTouches[0].clientY));
handleArea.addEventListener('mousedown',  e => startDrag(e.clientY));
document.addEventListener('mousemove',  e => moveDrag(e.clientY));
document.addEventListener('mouseup',    e => endDrag(e.clientY));

// ── INIT ──
buildWorld();

// Resize handler
window.addEventListener('resize', () => {
  map.innerHTML = '';
  buildWorld();
  // Restore scooter position
  const scooter = document.getElementById('scooter-wrap');
  if (scooter) {
    scooter.style.left = scooterX + '%';
    scooter.style.top  = scooterY + '%';
  }
});
</script>
