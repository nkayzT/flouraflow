<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlouraFlow — Portfolio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Caveat:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --orange: #F4A340;
    --deep-orange: #E8732A;
    --road: #5B7FA6;
    --road-dark: #4A6B8F;
    --peach: #F7C88E;
    --sky: #B8D4E8;
    --cream: #FFF3DC;
    --dark: #1A1A2E;
    --text: #2C2C3E;
    --white: #FFFEF8;
  }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Space Grotesk', sans-serif;
    background: var(--dark);
  }

  /* ── LAYOUT ── */
  #app {
    display: flex;
    width: 100vw; height: 100vh;
  }

  /* ── LEFT PANEL ── */
  #left {
    flex: 0 0 50%;
    position: relative;
    overflow: hidden;
    background: var(--orange);
  }

  /* Tilted road grid – top-down view */
  #street {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(135deg, transparent 0px, transparent 58px, rgba(255,255,255,.06) 58px, rgba(255,255,255,.06) 60px),
      repeating-linear-gradient(45deg,  transparent 0px, transparent 58px, rgba(255,255,255,.06) 58px, rgba(255,255,255,.06) 60px),
      var(--orange);
  }

  /* Main road diagonal */
  .road {
    position: absolute;
    background: var(--road);
  }
  .road-h {
    width: 200%; height: 130px;
    top: 55%; left: -50%;
    transform: rotate(-8deg);
    background: var(--road);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.1), inset 0 -2px 0 rgba(0,0,0,.15);
  }
  .road-v {
    width: 100px; height: 200%;
    top: -50%; left: 58%;
    transform: rotate(-8deg);
    background: var(--road-dark);
  }

  /* Road markings */
  .road-dashes {
    position: absolute;
    width: 200%; height: 4px;
    top: calc(55% + 63px); left: -50%;
    transform: rotate(-8deg);
    background: repeating-linear-gradient(90deg,
      var(--orange) 0, var(--orange) 30px,
      transparent 30px, transparent 60px
    );
    opacity: .6;
  }

  /* Buildings / blocks */
  .block {
    position: absolute;
    border-radius: 3px;
  }

  /* Sidewalk */
  .sidewalk {
    position: absolute;
    background: #E8B87A;
    border-radius: 4px;
  }

  /* ── SCOOTER ── */
  #scooter-wrap {
    position: absolute;
    bottom: 38%;
    left: 12%;
    width: 120px;
    transform-origin: center bottom;
    transition: none;
    z-index: 20;
    filter: drop-shadow(4px 6px 8px rgba(0,0,0,.35));
  }
  #scooter-wrap.idle { animation: bob 2.4s ease-in-out infinite; }
  #scooter-wrap.riding {
    animation: none;
    transition: left 1.8s cubic-bezier(.45,0,.55,1),
                bottom 1.8s cubic-bezier(.45,0,.55,1);
  }
  #scooter-wrap.arrived { animation: arrive-bounce .4s ease-out; }

  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(-6px) rotate(1deg); }
  }
  @keyframes arrive-bounce {
    0%   { transform: translateY(0) scaleX(1); }
    30%  { transform: translateY(-12px) scaleX(.95); }
    60%  { transform: translateY(4px) scaleX(1.05); }
    100% { transform: translateY(0) scaleX(1); }
  }

  /* Speed lines */
  #speed-lines {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 15;
    opacity: 0; transition: opacity .2s;
  }
  #speed-lines.active { opacity: 1; }
  .speed-line {
    position: absolute;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
    border-radius: 1px;
    animation: speedline 0.4s linear infinite;
  }
  @keyframes speedline {
    0%   { transform: translateX(60px); opacity: 1; }
    100% { transform: translateX(-200px); opacity: 0; }
  }

  /* Dust particles */
  .dust {
    position: absolute; border-radius: 50%;
    background: rgba(255,220,150,.6);
    pointer-events: none; z-index: 14;
    animation: dust-float 1.2s ease-out forwards;
  }
  @keyframes dust-float {
    0%   { transform: translate(0,0) scale(1); opacity: .8; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; }
  }

  /* Screen flash on arrival */
  #flash {
    position: absolute; inset: 0; z-index: 100;
    background: white; opacity: 0; pointer-events: none;
    transition: opacity .1s;
  }
  #flash.pop { opacity: .45; }

  /* Left title */
  #left-title {
    position: absolute; top: 24px; left: 24px; z-index: 30;
    font-family: 'Caveat', cursive;
    font-size: 28px; font-weight: 600;
    color: var(--dark);
    text-shadow: 2px 2px 0 rgba(255,255,255,.3);
    line-height: 1.2;
  }
  #left-title span { font-size: 14px; font-weight: 400; display: block; margin-top: 2px; opacity: .7; }

  /* ── RIGHT PANEL ── */
  #right {
    flex: 0 0 50%;
    position: relative;
    overflow: hidden;
    background: var(--cream);
  }

  /* Stylised map background */
  #map-bg {
    position: absolute; inset: 0;
    background: #EDE8D8;
  }

  /* Map roads */
  .map-road {
    position: absolute;
    background: #C8BFA0;
    border-radius: 2px;
  }
  .map-road.active-road { background: var(--deep-orange); }

  /* Map blocks */
  .map-block {
    position: absolute;
    background: #D4CBB0;
    border-radius: 4px;
    border: 1.5px solid #BFB699;
  }

  /* Park */
  .map-park {
    position: absolute;
    background: #B8D4A8;
    border-radius: 6px;
    border: 1.5px solid #98B888;
  }

  /* Water */
  .map-water {
    position: absolute;
    background: #A8C8DC;
    border-radius: 8px;
  }

  /* ── PINS ── */
  .pin {
    position: absolute;
    width: 44px; height: 52px;
    cursor: pointer;
    z-index: 10;
    transform: translate(-50%, -100%);
    transition: transform .2s, filter .2s;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.3));
  }
  .pin:hover { transform: translate(-50%, -110%) scale(1.15); filter: drop-shadow(0 6px 12px rgba(0,0,0,.35)); }
  .pin.visited .pin-body { fill: var(--deep-orange); }
  .pin.active  .pin-body { fill: #E8235A; }

  .pin-pulse {
    position: absolute; bottom: 2px; left: 50%;
    transform: translate(-50%, 0);
    width: 14px; height: 14px;
    border-radius: 50%;
    background: rgba(232,115,42,.4);
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0%   { transform: translate(-50%,0) scale(1); opacity: .8; }
    100% { transform: translate(-50%,0) scale(3); opacity: 0; }
  }

  /* Pin label */
  .pin-label {
    position: absolute;
    bottom: 56px; left: 50%;
    transform: translateX(-50%);
    background: var(--dark);
    color: var(--white);
    font-size: 11px; font-weight: 500;
    white-space: nowrap;
    padding: 4px 8px;
    border-radius: 6px;
    pointer-events: none;
    opacity: 0; transition: opacity .2s;
  }
  .pin:hover .pin-label { opacity: 1; }

  /* Moving dot on map */
  #map-scooter {
    position: absolute;
    width: 22px; height: 22px;
    z-index: 12;
    transform: translate(-50%, -50%);
    transition: left 1.8s cubic-bezier(.45,0,.55,1), top 1.8s cubic-bezier(.45,0,.55,1);
  }

  /* ── PROJECT CARD / MODAL ── */
  #card-overlay {
    position: absolute; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: rgba(26,26,46,.55);
    backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity .35s;
  }
  #card-overlay.open { opacity: 1; pointer-events: all; }

  #card {
    background: var(--white);
    border-radius: 20px;
    width: 88%; max-width: 380px;
    padding: 28px 28px 24px;
    box-shadow: 0 24px 64px rgba(0,0,0,.25);
    transform: translateY(30px) scale(.95);
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
    position: relative;
    overflow: hidden;
  }
  #card-overlay.open #card { transform: translateY(0) scale(1); }

  #card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: linear-gradient(90deg, var(--orange), var(--deep-orange));
  }

  .card-tag {
    display: inline-block;
    background: var(--peach);
    color: var(--deep-orange);
    font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 20px;
    letter-spacing: .5px; text-transform: uppercase;
    margin-bottom: 12px;
  }

  .card-title {
    font-size: 22px; font-weight: 600;
    color: var(--dark); line-height: 1.2;
    margin-bottom: 8px;
  }

  .card-location {
    font-size: 12px; color: #888;
    display: flex; align-items: center; gap: 4px;
    margin-bottom: 14px;
  }

  .card-desc {
    font-size: 14px; color: #555;
    line-height: 1.65;
    margin-bottom: 18px;
  }

  .card-tags {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 20px;
  }
  .card-tech {
    background: #F0EDE4;
    color: #666;
    font-size: 11px; font-weight: 500;
    padding: 4px 10px; border-radius: 6px;
  }

  .card-actions {
    display: flex; gap: 10px;
  }
  .card-btn {
    flex: 1; padding: 10px 16px;
    border-radius: 10px; border: none;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px; font-weight: 600;
    cursor: pointer; transition: transform .15s, box-shadow .15s;
  }
  .card-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.15); }
  .card-btn.primary { background: var(--dark); color: white; }
  .card-btn.secondary { background: var(--peach); color: var(--deep-orange); }

  #card-close {
    position: absolute; top: 16px; right: 16px;
    width: 28px; height: 28px;
    background: #F0EDE4; border: none; border-radius: 50%;
    cursor: pointer; font-size: 16px; color: #888;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  #card-close:hover { background: #DDD; }

  /* ── ZOOM RING on map ── */
  .zoom-ring {
    position: absolute;
    border-radius: 50%;
    border: 3px solid var(--deep-orange);
    pointer-events: none; z-index: 11;
    transform: translate(-50%,-50%) scale(0);
    animation: zoom-in .6s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes zoom-in {
    0%   { transform: translate(-50%,-50%) scale(0); opacity: 1; }
    70%  { transform: translate(-50%,-50%) scale(1.1); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: .7; }
  }

  /* ── RIGHT TITLE / HINT ── */
  #map-title {
    position: absolute; top: 20px; left: 20px; z-index: 20;
    font-family: 'Caveat', cursive;
    font-size: 22px; font-weight: 600;
    color: var(--text);
    pointer-events: none;
  }
  #map-hint {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #999; z-index: 20;
    background: rgba(255,255,255,.7);
    padding: 6px 14px; border-radius: 20px;
    pointer-events: none;
    animation: float-hint 3s ease-in-out infinite;
  }
  @keyframes float-hint {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-4px); }
  }

  /* Notification toast */
  #toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--dark); color: var(--white);
    font-size: 13px; font-weight: 500;
    padding: 10px 20px; border-radius: 30px;
    opacity: 0; transition: opacity .3s, transform .3s;
    z-index: 200; pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <!-- ═══════════════ LEFT ═══════════════ -->
  <div id="left">
    <div id="street"></div>

    <!-- Roads -->
    <div class="road road-h"></div>
    <div class="road road-v"></div>
    <div class="road-dashes"></div>

    <!-- City blocks -->
    <div class="block sidewalk" style="width:140px;height:90px;top:12%;left:5%;background:#E0AA6A;border-radius:6px;"></div>
    <div class="block sidewalk" style="width:90px;height:60px;top:18%;left:12%;background:#D49A5A;border-radius:6px;"></div>
    <!-- Buildings top-left -->
    <div class="block" style="width:60px;height:70px;top:8%;left:6%;background:#C8835A;border-radius:4px 4px 0 0;border-bottom:4px solid #A06040;"></div>
    <div class="block" style="width:40px;height:50px;top:14%;left:16%;background:#D9956A;border-radius:4px 4px 0 0;border-bottom:3px solid #B07050;"></div>
    <div class="block" style="width:70px;height:55px;top:5%;left:30%;background:#C87A50;border-radius:4px 4px 0 0;"></div>
    <!-- Trees -->
    <div class="block" style="width:18px;height:18px;top:40%;left:8%;background:#6AAF6A;border-radius:50%;box-shadow:0 0 0 4px #5A9F5A;"></div>
    <div class="block" style="width:22px;height:22px;top:44%;left:4%;background:#78C078;border-radius:50%;box-shadow:0 0 0 5px #68B068;"></div>
    <div class="block" style="width:16px;height:16px;top:38%;left:15%;background:#6AAF6A;border-radius:50%;box-shadow:0 0 0 4px #5A9F5A;"></div>
    <!-- Buildings bottom-right (past road) -->
    <div class="block" style="width:50px;height:45px;top:72%;left:64%;background:#8BA8C8;border-radius:4px;"></div>
    <div class="block" style="width:35px;height:38px;top:75%;left:74%;background:#7898B8;border-radius:4px;"></div>

    <!-- Speed lines layer -->
    <div id="speed-lines">
      <div class="speed-line" style="top:52%;width:180px;left:40%;animation-delay:0s;animation-duration:.35s;"></div>
      <div class="speed-line" style="top:55%;width:220px;left:35%;animation-delay:.07s;animation-duration:.4s;"></div>
      <div class="speed-line" style="top:48%;width:140px;left:45%;animation-delay:.14s;animation-duration:.3s;"></div>
      <div class="speed-line" style="top:60%;width:160px;left:38%;animation-delay:.05s;animation-duration:.38s;"></div>
      <div class="speed-line" style="top:44%;width:120px;left:50%;animation-delay:.1s;animation-duration:.32s;"></div>
    </div>

    <!-- Flash overlay -->
    <div id="flash"></div>

    <!-- SCOOTER SVG -->
    <div id="scooter-wrap" class="idle">
      <svg viewBox="0 0 120 90" xmlns="http://www.w3.org/2000/svg" width="120">
        <!-- Shadow -->
        <ellipse cx="60" cy="86" rx="42" ry="5" fill="rgba(0,0,0,.18)"/>
        <!-- Rear wheel -->
        <circle cx="22" cy="72" r="14" fill="#2A2A3E" stroke="#444" stroke-width="2"/>
        <circle cx="22" cy="72" r="9"  fill="#3A3A55"/>
        <circle cx="22" cy="72" r="3"  fill="#888"/>
        <!-- Front wheel -->
        <circle cx="95" cy="72" r="14" fill="#2A2A3E" stroke="#444" stroke-width="2"/>
        <circle cx="95" cy="72" r="9"  fill="#3A3A55"/>
        <circle cx="95" cy="72" r="3"  fill="#888"/>
        <!-- Body -->
        <path d="M30 68 Q20 50 35 42 L60 38 L80 36 Q95 34 100 42 L105 58 Q108 68 95 72 L22 72 Q14 68 30 68Z" fill="#3A3A5A"/>
        <!-- Seat top -->
        <path d="M38 42 Q50 36 72 34 L80 36 Q70 38 50 42Z" fill="#2A2A3E"/>
        <!-- Body highlight -->
        <path d="M45 52 Q55 46 75 44 Q85 44 88 50" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Front fairing -->
        <path d="M96 42 Q106 44 108 56 L105 58 Q100 48 94 46Z" fill="#4A4A6A"/>
        <!-- Headlight -->
        <ellipse cx="106" cy="54" rx="5" ry="4" fill="#FFE880" opacity=".9"/>
        <ellipse cx="106" cy="54" rx="3" ry="2.5" fill="white" opacity=".8"/>
        <!-- Windshield -->
        <path d="M80 36 Q90 32 97 38 L96 42 Q88 36 80 38Z" fill="#A0CCE8" opacity=".6"/>
        <!-- Exhaust -->
        <path d="M30 68 Q18 70 12 66" fill="none" stroke="#888" stroke-width="3" stroke-linecap="round"/>

        <!-- RIDER 1 (driver) – helmet + body -->
        <ellipse cx="60" cy="20" rx="13" ry="12" fill="#E0E0F0"/>  <!-- helmet -->
        <ellipse cx="60" cy="20" rx="11" ry="10" fill="#C8C8E0"/>
        <!-- visor -->
        <path d="M50 20 Q60 14 70 20" fill="#6080A0" opacity=".7"/>
        <!-- body -->
        <path d="M52 32 Q50 42 48 44 L72 44 Q70 42 68 32Z" fill="#2A2A3E"/>
        <!-- arms -->
        <path d="M52 36 Q42 38 36 40" fill="none" stroke="#E0C8A0" stroke-width="4" stroke-linecap="round"/>
        <path d="M68 36 Q78 34 88 38" fill="none" stroke="#E0C8A0" stroke-width="4" stroke-linecap="round"/>
        <!-- hands on bars -->
        <circle cx="36" cy="40" r="3.5" fill="#E0C8A0"/>
        <circle cx="88" cy="38" r="3.5" fill="#E0C8A0"/>
        <!-- handlebar -->
        <path d="M33 38 L40 36 L92 36 L96 38" fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
        <!-- legs -->
        <path d="M54 44 L50 60 L44 62" fill="none" stroke="#2A2A3E" stroke-width="5" stroke-linecap="round"/>
        <!-- shoes -->
        <ellipse cx="42" cy="63" rx="6" ry="3.5" fill="#E84050"/>

        <!-- RIDER 2 (pillion) – slightly behind -->
        <ellipse cx="46" cy="18" rx="11" ry="10" fill="#F0D0B0"/>  <!-- hair poof -->
        <path d="M37 18 Q38 10 46 10 Q54 10 57 18" fill="#3A2A1A"/>
        <ellipse cx="46" cy="20" rx="10" ry="9" fill="#F0D0B0"/>  <!-- face -->
        <!-- eyes -->
        <ellipse cx="42" cy="20" rx="1.5" ry="1.8" fill="#2A1A0A"/>
        <ellipse cx="50" cy="20" rx="1.5" ry="1.8" fill="#2A1A0A"/>
        <!-- body -->
        <path d="M38 30 Q36 40 36 44 L56 44 Q56 40 54 30Z" fill="#E87868"/>
        <!-- backpack -->
        <rect x="30" y="28" width="12" height="16" rx="3" fill="#4A6AAA"/>
        <rect x="31" y="32" width="10" height="2" rx="1" fill="#6A8ACA"/>
      </svg>
    </div>

    <!-- Left panel title -->
    <div id="left-title">
      FlouraFlow
      <span>click a location to ride there →</span>
    </div>
  </div>

  <!-- ═══════════════ RIGHT ═══════════════ -->
  <div id="right">
    <div id="map-bg"></div>

    <!-- Map roads (horizontal + vertical grid) -->
    <div class="map-road" style="width:100%;height:18px;top:25%;left:0;"></div>
    <div class="map-road" style="width:100%;height:12px;top:55%;left:0;"></div>
    <div class="map-road" style="width:100%;height:8px;top:75%;left:0;"></div>
    <div class="map-road" style="width:16px;height:100%;top:0;left:18%;"></div>
    <div class="map-road" style="width:12px;height:100%;top:0;left:45%;"></div>
    <div class="map-road" style="width:8px;height:100%;top:0;left:72%;"></div>
    <!-- Diagonal accent road -->
    <div class="map-road" style="width:200%;height:10px;top:40%;left:-50%;transform:rotate(-15deg);opacity:.5;"></div>

    <!-- City blocks -->
    <div class="map-block" style="width:14%;height:18%;top:5%;left:2%;"></div>
    <div class="map-block" style="width:18%;height:14%;top:5%;left:22%;"></div>
    <div class="map-block" style="width:20%;height:16%;top:5%;left:48%;"></div>
    <div class="map-block" style="width:12%;height:12%;top:5%;left:76%;"></div>
    <!-- Row 2 -->
    <div class="map-block" style="width:22%;height:22%;top:30%;left:2%;"></div>
    <div class="map-block" style="width:16%;height:20%;top:30%;left:26%;"></div>
    <div class="map-block" style="width:18%;height:22%;top:30%;left:48%;"></div>
    <div class="map-block" style="width:16%;height:20%;top:30%;left:76%;"></div>
    <!-- Row 3 -->
    <div class="map-block" style="width:24%;height:14%;top:60%;left:2%;"></div>
    <div class="map-block" style="width:18%;height:16%;top:60%;left:28%;"></div>
    <div class="map-block" style="width:14%;height:14%;top:60%;left:76%;"></div>
    <!-- Park -->
    <div class="map-park" style="width:20%;height:12%;top:60%;left:50%;"></div>
    <!-- Water -->
    <div class="map-water" style="width:18%;height:16%;top:80%;left:60%;border-radius:40% 60% 60% 40%;"></div>
    <!-- Row 4 -->
    <div class="map-block" style="width:26%;height:14%;top:82%;left:2%;"></div>
    <div class="map-block" style="width:20%;height:12%;top:82%;left:30%;"></div>

    <!-- Map scooter indicator -->
    <div id="map-scooter" style="left:18%;top:55%;">
      <svg viewBox="0 0 22 22" width="22" height="22">
        <circle cx="11" cy="11" r="10" fill="var(--dark)" stroke="white" stroke-width="2"/>
        <path d="M6 13 Q6 9 9 8 L13 7 Q16 7 17 9 L17 13 Q15 14 11 14 Q7 14 6 13Z" fill="white" opacity=".9"/>
        <circle cx="8" cy="14" r="1.8" fill="white"/>
        <circle cx="15" cy="14" r="1.8" fill="white"/>
      </svg>
    </div>

    <!-- PINS (will be injected via JS) -->

    <!-- Zoom ring container -->
    <div id="zoom-rings"></div>

    <!-- Project card overlay -->
    <div id="card-overlay">
      <div id="card">
        <button id="card-close">✕</button>
        <div class="card-tag" id="c-tag">Project</div>
        <div class="card-title" id="c-title">Project Name</div>
        <div class="card-location" id="c-loc">📍 Location</div>
        <div class="card-desc" id="c-desc">Description</div>
        <div class="card-tags" id="c-techs"></div>
        <div class="card-actions">
          <button class="card-btn primary" id="c-live">Live Demo ↗</button>
          <button class="card-btn secondary" id="c-code">Source Code</button>
        </div>
      </div>
    </div>

    <div id="map-title">My Journey</div>
    <div id="map-hint">📍 Click a pin to explore</div>
  </div>

</div>

<div id="toast"></div>

<script>
// ─── DATA ───────────────────────────────────────────────────────
const PROJECTS = [
  {
    id: 'p1',
    name: 'FlouraFlow',
    tag: 'Web App',
    location: 'Downtown Hub',
    desc: 'A full-stack plant care and tracking app. Users log their plants, set watering reminders, and track growth over time with photo journals.',
    techs: ['React', 'Node.js', 'MongoDB', 'Tailwind'],
    live: '#', code: '#',
    pin: { left: '20%', top: '20%' }
  },
  {
    id: 'p2',
    name: 'Neon Arcade',
    tag: 'Game',
    location: 'East Quarter',
    desc: 'A browser-based retro arcade collection built with Canvas API. Features high-score persistence, neon pixel aesthetics, and responsive controls.',
    techs: ['Vanilla JS', 'Canvas API', 'LocalStorage'],
    live: '#', code: '#',
    pin: { left: '70%', top: '15%' }
  },
  {
    id: 'p3',
    name: 'Transit Pulse',
    tag: 'Data Viz',
    location: 'Central Station',
    desc: 'Real-time bus & train delay heatmap for the city. Aggregates transit API data and renders animated flow maps with D3.js.',
    techs: ['D3.js', 'Python', 'FastAPI', 'WebSocket'],
    live: '#', code: '#',
    pin: { left: '45%', top: '48%' }
  },
  {
    id: 'p4',
    name: 'Lofi Corner',
    tag: 'Music App',
    location: 'Café District',
    desc: 'Curated lofi study music player with mood-based playlists, custom ambient mixer (rain, café, wind), and a pomodoro focus timer.',
    techs: ['Vue.js', 'Web Audio API', 'Supabase'],
    live: '#', code: '#',
    pin: { left: '78%', top: '62%' }
  },
  {
    id: 'p5',
    name: 'Pixel Market',
    tag: 'E-Commerce',
    location: 'West Village',
    desc: 'Indie digital goods marketplace for pixel artists. Sellers upload sprites, tilesets, and fonts. Stripe payments, instant download delivery.',
    techs: ['Next.js', 'Stripe', 'PostgreSQL', 'AWS S3'],
    live: '#', code: '#',
    pin: { left: '15%', top: '70%' }
  },
  {
    id: 'p6',
    name: 'Sky Notes',
    tag: 'Mobile App',
    location: 'North Park',
    desc: 'Minimalist note-taking PWA with end-to-end encryption. Supports Markdown, offline mode, cross-device sync, and dark/light themes.',
    techs: ['React Native', 'SQLite', 'Crypto API'],
    live: '#', code: '#',
    pin: { left: '52%', top: '82%' }
  }
];

// ─── STATE ──────────────────────────────────────────────────────
let riding = false;
let currentPin = null;

// ─── AUDIO ──────────────────────────────────────────────────────
const AC = new (window.AudioContext || window.webkitAudioContext)();

function playEngineRev() {
  const osc = AC.createOscillator();
  const gain = AC.createGain();
  osc.connect(gain); gain.connect(AC.destination);
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(80, AC.currentTime);
  osc.frequency.linearRampToValueAtTime(220, AC.currentTime + .4);
  osc.frequency.linearRampToValueAtTime(140, AC.currentTime + .8);
  osc.frequency.linearRampToValueAtTime(180, AC.currentTime + 1.4);
  gain.gain.setValueAtTime(.08, AC.currentTime);
  gain.gain.linearRampToValueAtTime(.14, AC.currentTime + .3);
  gain.gain.linearRampToValueAtTime(.05, AC.currentTime + 1.6);
  gain.gain.linearRampToValueAtTime(0, AC.currentTime + 1.85);
  osc.start(AC.currentTime);
  osc.stop(AC.currentTime + 1.85);
}

function playArrivalBell() {
  [523.25, 659.25, 783.99].forEach((freq, i) => {
    const osc = AC.createOscillator();
    const gain = AC.createGain();
    osc.connect(gain); gain.connect(AC.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    const t = AC.currentTime + i * .15;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(.18, t + .03);
    gain.gain.exponentialRampToValueAtTime(.001, t + .6);
    osc.start(t); osc.stop(t + .6);
  });
}

// ─── DUST PARTICLES ─────────────────────────────────────────────
function spawnDust(x, y) {
  const left = document.getElementById('left');
  for (let i = 0; i < 8; i++) {
    const d = document.createElement('div');
    d.className = 'dust';
    const size = 4 + Math.random() * 10;
    d.style.cssText = `
      width:${size}px; height:${size}px;
      left:${x - size/2}px; top:${y - size/2}px;
      --dx:${(Math.random()-0.5)*60}px;
      --dy:${(Math.random()-.2)*(-40)}px;
    `;
    left.appendChild(d);
    setTimeout(() => d.remove(), 1200);
  }
}

// ─── ZOOM RING ───────────────────────────────────────────────────
function spawnZoomRing(x, y) {
  const container = document.getElementById('zoom-rings');
  [28, 48, 70].forEach((size, i) => {
    setTimeout(() => {
      const r = document.createElement('div');
      r.className = 'zoom-ring';
      r.style.cssText = `width:${size}px;height:${size}px;left:${x};top:${y};`;
      container.appendChild(r);
      setTimeout(() => r.remove(), 900);
    }, i * 80);
  });
}

// ─── TOAST ───────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ─── BUILD PINS ──────────────────────────────────────────────────
function buildPins() {
  const right = document.getElementById('right');
  PROJECTS.forEach(proj => {
    const wrap = document.createElement('div');
    wrap.style.cssText = `position:absolute;left:${proj.pin.left};top:${proj.pin.top};z-index:10;`;

    const pin = document.createElement('div');
    pin.className = 'pin';
    pin.id = 'pin-' + proj.id;
    pin.innerHTML = `
      <svg viewBox="0 0 44 52" width="44" height="52" xmlns="http://www.w3.org/2000/svg">
        <path class="pin-body" d="M22 2C12.06 2 4 10.06 4 20C4 33 22 50 22 50C22 50 40 33 40 20C40 10.06 31.94 2 22 2Z"
              fill="${pinColor(proj.tag)}" stroke="white" stroke-width="2"/>
        <circle cx="22" cy="20" r="8" fill="white" opacity=".3"/>
        <text x="22" y="24" text-anchor="middle" font-size="11" fill="white" font-family="Space Grotesk,sans-serif" font-weight="600">
          ${proj.tag.slice(0,2).toUpperCase()}
        </text>
      </svg>
      <div class="pin-pulse"></div>
      <div class="pin-label">${proj.name}</div>
    `;
    pin.addEventListener('click', () => handlePinClick(proj, pin));
    wrap.appendChild(pin);
    right.appendChild(wrap);
  });
}

function pinColor(tag) {
  const map = {
    'Web App':'#E8732A','Game':'#8A5CF6','Data Viz':'#0EA5E9',
    'Music App':'#EC4899','E-Commerce':'#10B981','Mobile App':'#F59E0B'
  };
  return map[tag] || '#E8732A';
}

// ─── RIDE ANIMATION ──────────────────────────────────────────────
function handlePinClick(proj, pinEl) {
  if (riding) return;
  riding = true;
  if (currentPin) currentPin.classList.remove('active');
  currentPin = pinEl;
  pinEl.classList.add('active');

  AC.resume();
  playEngineRev();

  // Speed lines on
  const sl = document.getElementById('speed-lines');
  sl.classList.add('active');

  // Move scooter on left panel (simulate riding across scene)
  const scooter = document.getElementById('scooter-wrap');
  scooter.classList.remove('idle', 'arrived');
  scooter.classList.add('riding');

  // Animate to random "exit" point then come back centered
  const startLeft = 12 + Math.random() * 30;
  const startBottom = 36 + Math.random() * 8;
  scooter.style.left = startLeft + '%';
  scooter.style.bottom = startBottom + '%';

  setTimeout(() => {
    scooter.style.left = (55 + Math.random()*15) + '%';
    scooter.style.bottom = (38 + Math.random()*6) + '%';
  }, 50);

  // Move map scooter indicator to pin location
  const mapScooter = document.getElementById('map-scooter');
  mapScooter.style.left = proj.pin.left;
  mapScooter.style.top  = proj.pin.top;

  // After travel duration
  setTimeout(() => {
    sl.classList.remove('active');
    scooter.classList.remove('riding');
    scooter.classList.add('idle');

    // Reset position
    scooter.style.left = '12%';
    scooter.style.bottom = '38%';

    // Flash
    const flash = document.getElementById('flash');
    flash.classList.add('pop');
    setTimeout(() => flash.classList.remove('pop'), 180);

    // Arrival bell
    playArrivalBell();

    // Dust
    const rect = scooter.getBoundingClientRect();
    const leftRect = document.getElementById('left').getBoundingClientRect();
    spawnDust(rect.left - leftRect.left + rect.width/2, rect.top - leftRect.top + rect.height);

    // Zoom ring on map
    spawnZoomRing(proj.pin.left, proj.pin.top);

    // Show card after brief delay
    setTimeout(() => {
      showCard(proj);
      pinEl.classList.add('visited');
      riding = false;
    }, 500);

  }, 2000);
}

// ─── CARD ────────────────────────────────────────────────────────
function showCard(proj) {
  document.getElementById('c-tag').textContent   = proj.tag;
  document.getElementById('c-tag').style.background = lightenColor(pinColor(proj.tag));
  document.getElementById('c-tag').style.color      = pinColor(proj.tag);
  document.getElementById('c-title').textContent = proj.name;
  document.getElementById('c-loc').innerHTML     = `📍 ${proj.location}`;
  document.getElementById('c-desc').textContent  = proj.desc;

  const techs = document.getElementById('c-techs');
  techs.innerHTML = proj.techs.map(t => `<span class="card-tech">${t}</span>`).join('');

  document.getElementById('c-live').onclick = () => { if(proj.live !== '#') window.open(proj.live,'_blank'); };
  document.getElementById('c-code').onclick = () => { if(proj.code !== '#') window.open(proj.code,'_blank'); };

  document.getElementById('card-overlay').classList.add('open');
  showToast(`🛵 Arrived at ${proj.location}!`);
}

function lightenColor(hex) {
  // very simple: return pastel version
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},0.15)`;
}

document.getElementById('card-close').addEventListener('click', () => {
  document.getElementById('card-overlay').classList.remove('open');
  // Reset scooter idle
  const s = document.getElementById('scooter-wrap');
  s.classList.remove('riding','arrived');
  s.classList.add('idle');
  s.style.left = '12%';
  s.style.bottom = '38%';
});

document.getElementById('card-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('card-overlay')) {
    document.getElementById('card-close').click();
  }
});

// ─── INIT ────────────────────────────────────────────────────────
buildPins();

// Resume audio context on first interaction
document.addEventListener('click', () => AC.resume(), { once: true });
</script>
</body>
</html>
